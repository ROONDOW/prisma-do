  <path d="M43 34 L58 34" stroke="#e6cf9c" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M41 38 L58 46" stroke="#f2f5fa" stroke-width="3.2" stroke-linecap="round"/>
</svg>
